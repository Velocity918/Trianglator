<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trianglator — Gallery</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: #f5f5f5;
        color: #222;
        font-family: Arial, sans-serif;
    }

    /* Header */

    header {
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: space-between;

        max-width: 1200px;
        margin: 0 auto;
        padding: 0 30px;
    }

    header h1 {
        margin: 0;
        font-size: 30px;
        font-weight: normal;
    }

    header a {
        color: #222;
        text-decoration: none;
        font-size: 14px;
    }

    header a:hover {
        text-decoration: underline;
    }

    /* Gallery */

    .gallery {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px;
    }

    .artwork {
        min-height: 85vh;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: 70px 0;
    }

    .artwork-number {
        font-size: 12px;
        color: #888;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    .images {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 35px;

        align-items: start;
    }

    .image-wrapper {
        background: white;
        padding: 12px;
    }

    .image-wrapper img {
        display: block;
        width: 100%;
        height: auto;
    }

    .label {
        margin-top: 12px;
        font-size: 13px;
        color: #666;
    }

    .title {
        margin-top: 25px;
        font-size: 18px;
        font-weight: normal;
    }

    /* Divider */

    .divider {
        width: 100%;
        height: 1px;
        background: #d5d5d5;
    }

    /* Bottom */

    .footer {
        text-align: center;
        padding: 80px 20px;
        color: #888;
        font-size: 13px;
    }

    /* Mobile */

    @media (max-width: 700px) {

        header {
            height: 80px;
            padding: 0 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .gallery {
            padding: 20px;
        }

        .artwork {
            min-height: auto;
            padding: 50px 0;
        }

        .images {
            grid-template-columns: 1fr;
            gap: 25px;
        }
    }
</style>

</head>

<body>

<header>
    <h1>Trianglator  -  Gallery</h1>
    <a href="/">Back to Trianglator</a>
</header>

<main class="gallery" id="gallery"></main>


<script>



const artworks = [

    {
        title: "Mountains",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/1OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/1NEW.png?raw=true"
    },

    {
        title: "Formula 1",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/2OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/2NEW.png?raw=true"
    },

    {
        title: "Field of Flowers",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/3OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/3NEW.png?raw=true"
    },

    {
        title: "Jellyfish",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/4OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/4NEW.png?raw=true"
    },

    {
        title: "Spacewalk",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/5OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/5NEW.png?raw=true"
    },

    {
        title: "Parrots",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/6OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/6NEW.png?raw=true"
    },

    {
        title: "Castle",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/7OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/7NEW.png?raw=true"
    },

    {
        title: "Campfire",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/8OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/8NEW.png?raw=true"
    },

    {
        title: "Julius Caesar",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/9OG.webp?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/9NEW.png?raw=true"
    },

    {
        title: "Japanese Temple",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/10OG.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/10NEW.png?raw=true"
    },

    {
        title: "Volcano",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/11OG.webp?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/11NEW.png?raw=true"
    },

    {
        title: "Coral Reef",
        original: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/OG12.jpg?raw=true",
        triangulated: "https://github.com/Velocity918/Trianglator/blob/main/Gallery_Images/NEW12.png?raw=true"
    }

];


/*
====================================================
GENERATE GALLERY
====================================================
*/

const gallery = document.getElementById("gallery");

artworks.forEach((artwork, index) => {

    const section = document.createElement("section");
    section.className = "artwork";

    section.innerHTML = `

        <div class="artwork-number">
            ${String(index + 1).padStart(2, "0")}
        </div>

        <div class="images">

            <div>
                <div class="image-wrapper">
                    <img
                        src="${artwork.original}"
                        alt="${artwork.title} original"
                    >
                </div>

                <div class="label">
                    Original
                </div>
            </div>


            <div>
                <div class="image-wrapper">
                    <img
                        src="${artwork.triangulated}"
                        alt="${artwork.title} triangulated"
                    >
                </div>

                <div class="label">
                    After Trianglator
                </div>
            </div>

        </div>

        <div class="title">
            ${artwork.title}
        </div>

    `;

    gallery.appendChild(section);


    // Divider between artworks

    if (index < artworks.length - 1) {

        const divider = document.createElement("div");
        divider.className = "divider";

        gallery.appendChild(divider);
    }

});

</script>

</body>

</html>
